<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TIET Smart Dispensary - Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .header {
            background: #b5121b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .login-box {
            width: 400px;
            background: white;
            margin: 80px auto;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #b5121b;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #b5121b;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8f0e16;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b5121b;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="header">
        <h2>TIET Smart Dispensary</h2>
    </div>

    <div class="login-box">

        <h1>Student Login</h1>

        <p>Login to access the TIET Smart Dispensary</p>
        {% if error %}
    <p style="color: #b5121b; font-weight: bold;">
        {{ error }}
    </p>
        {% endif %}

        <form method="POST" action="/login">

            <label for="student_id">
                Student ID
            </label>

            <input
                type="text"
                id="student_id"
                name="student_id"
                placeholder="Enter your Student ID"
                required
            >
            
        

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
